[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simops-lab"
version = "0.1.1"
description = "Portable, reproducible experiment campaigns for simulation and system evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "asolanieto" }]
dependencies = []

keywords = ["mcp", "simulation", "robotics", "nav2", "ros2", "parameter-tuning", "ai-agents"]

[project.urls]
Homepage = "https://github.com/asolanieto/SimOpsLab"
Issues = "https://github.com/asolanieto/SimOpsLab/issues"

[project.scripts]
simops = "simops.cli:main"

[project.entry-points."simops.backends"]
nav2-docker = "simops.nav2_docker:Nav2DockerBackend"

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3.0"]
optimize = ["optuna>=5.0,<6.0"]
report = ["jinja2>=3.1", "plotly>=5.0"]
stats = ["numpy>=1.26", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "B904", "B905"]
